name: Test FlaPol style rules

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up minimum supported Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install pinned Vale release
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output vale.tar.gz \
            https://github.com/vale-cli/vale/releases/download/v3.17.1/vale_3.17.1_Linux_64-bit.tar.gz
          echo "db947f89f2292e6a0381a61de155f6a5f5cb4cb460ca178ea412ef605559cefd  vale.tar.gz" | sha256sum --check
          mkdir vale-bin
          tar -xzf vale.tar.gz -C vale-bin

      - name: Run rule fixtures and coverage validation
        env:
          VALE_BIN: ${{ github.workspace }}/vale-bin/vale
        run: ruby tools/test_rules.rb

      - name: Run protected processor tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Install Python package
        run: python3 -m pip install .

      - name: Smoke-test installed package and registry data
        run: |
          cd /tmp
          python3 -I -c "import flapol_style; assert flapol_style.__version__; assert flapol_style.load_word_preferences(); assert flapol_style.load_capitalization_rules()"
